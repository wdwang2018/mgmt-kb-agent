# Render 部署蓝图（Blueprint）：Dashboard → New Blueprint 选本仓库即可一键部署
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mgmt-kb-agent
    runtime: python
    plan: free
    region: singapore          # 国内访问延迟最低；GLM API 在国内，距离最近
    buildCommand: "pip install -r requirements.txt"
    # $PORT 由 Render 注入；路径全部按 __file__ 相对定位，cd backend 不影响 knowledge/ 定位
    startCommand: "cd backend && uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: LLM_MODE
        value: fallback         # 故障降级链：GLM 优先，失败自动回落 Mock，流水线永不硬失败
      - key: LLM_FALLBACK_ORDER
        value: "glm,mock"       # 仅配置 GLM Key，故链为 glm→mock；补 DEEPSEEK_API_KEY 后可改 glm,deepseek,mock
      - key: VECTOR_MODE
        value: hybrid           # BM25 + 稠密双路召回 RRF 融合；milvus 不可用自动降级 memory
      - key: EMBED_MODE
        value: glm              # GLM embedding-3（2048 维）
      - key: GRAPH_MODE
        value: kuzu             # 嵌入式图库；构造失败自动降级 none（图面板隐藏）
      # ---- P1 可靠性：检查点持久化 ----
      - key: CHECKPOINT_MODE
        value: sqlite           # 默认即 sqlite（嵌入式文件，重启不丢进行中的会话）；
                                # postgres 需配 CHECKPOINT_POSTGRES_DSN，缺失自动降级 sqlite
      # ---- 敏感项：sync:false 表示不进仓库，部署时在 Dashboard 手填 ----
      - key: GLM_API_KEY
        sync: false
      # ---- P0 安全：API Key 鉴权（同步项仅 CORS/限流；Key 本身必须手填）----
      - key: API_KEY
        sync: false              # 设置后所有 API 请求需带 X-API-Key 头；/healthz 与首页豁免
      - key: CORS_ORIGINS
        value: "https://mgmt-kb-agent.onrender.com"   # 线上域名白名单（本地任意端口已内置放行）
      - key: RATE_LIMIT_IP
        value: "120"             # 每 IP 每分钟请求数；0 = 不限
      - key: RATE_LIMIT_KEY
        value: "300"             # 每 API Key 每分钟请求数；0 = 不限
      - key: RATE_LIMIT_WINDOW
        value: "60"              # 限流窗口秒数
      # ---- P2 可观测性：结构化日志 ----
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"            # 单行 JSON，便于 Render 日志面板/集中采集解析；本地可改 text
      # LOG_DIR 不设置 = 仅控制台（Render 捕获 stdout）；如需落盘可设 /tmp/logs
